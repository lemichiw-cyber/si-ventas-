name: Deploy Frontend a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        run: npm install
        working-directory: frontend

      - name: Build (API Render + base de GitHub Pages)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://dulce-encanto.onrender.com/api
          VITE_BASE: /si-ventas-/

      - name: SPA fallback (GitHub Pages no conoce las rutas de React Router)
        run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4