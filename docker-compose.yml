version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dulce
      POSTGRES_PASSWORD: dulce123
      POSTGRES_DB: dulce_encanto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    depends_on: [postgres]

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on: [backend]

volumes:
  pgdata:
