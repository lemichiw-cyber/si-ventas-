name: dulce-encanto

services:
  tienda:
    build: .
    container_name: dulce-encanto
    environment:
      # ⚠️ Cambia este secreto en producción
      - JWT_SECRET=dulce-secreto-cambia-en-produccion
      - EMAIL_SIMULADO=true
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

volumes:
  sqlite-data:
